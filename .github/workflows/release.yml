# Standalone Linux release packaging for cn, conaryd, and conary-mcp with no
# Nix and no FieldmouseWorks/burrow dependency. Builds and verifies the
# versioned .tar.gz archive and SHA256SUMS with read-only permissions, and
# publishes a GitHub Release only on v* tags or an explicit publish dispatch.
name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. v0.1.0); defaults to dev-<short-sha>"
        required: false
        type: string
      publish:
        description: "Publish a GitHub Release for an existing tag matching version"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve release version and checkout ref
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            value="$REF_NAME"
            checkout_ref="refs/tags/$value"
            verify_tag="true"
          elif [ "$INPUT_PUBLISH" = "true" ]; then
            if [ -z "$INPUT_VERSION" ]; then
              echo "publish=true requires an existing tag in inputs.version" >&2
              exit 1
            fi
            value="$INPUT_VERSION"
            checkout_ref="refs/tags/$value"
            verify_tag="true"
          else
            if [ -n "$INPUT_VERSION" ]; then
              value="$INPUT_VERSION"
            else
              value="dev-${SHA:0:12}"
            fi
            checkout_ref=""
            verify_tag="false"
          fi
          if [[ ! "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || [[ "$value" == *".."* ]]; then
            echo "invalid version label: $value" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "verify_tag=$verify_tag" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.version.outputs.checkout_ref }}
          persist-credentials: false
      - name: Verify checked-out commit matches release tag
        if: steps.version.outputs.verify_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [ "$head_sha" != "$tag_sha" ]; then
            echo "checked-out commit ($head_sha) does not match tag $TAG ($tag_sha)" >&2
            exit 1
          fi
      - name: Verify toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Build release binaries
        run: cargo build --release --locked --bin cn --bin conaryd --bin conary-mcp
      - name: Package and verify release archive
        uses: ./.github/actions/package-release
        with:
          version: ${{ steps.version.outputs.value }}
          out-dir: dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conary-release-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: package
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: conary-release-${{ needs.package.outputs.version }}
          path: dist
      - name: Verify checksums before publishing
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "Conary $TAG" --generate-notes
          fi
