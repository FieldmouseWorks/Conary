name: line-cap-issue-state

on:
  issues:
    types: [closed, reopened, deleted]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  live-issue-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check current decomposition issue ownership
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/refresh-line-cap-issue-state.sh --check
