# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow, on a GitHub-hosted runner, the way burrow's own gate does.
# The repo is public (#12), so hosted minutes cost nothing, and no PR, a fork's
# included, runs on remi. Jobs the flake can't hold (browsers, VMs) go
# alongside.
name: flake
on:
  # `edited` for a PR retargeted onto another branch: the shared workflow's
  # run counts only for the base it judged, so a new base needs a run.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    # Of the edits, only a new base: a title or body changes nothing checked.
    if: github.event.action != 'edited' || github.event.changes.base
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@63322a9829c8a49678db893b23d533c0f9a510af # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
