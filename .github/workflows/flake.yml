# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow, on a GitHub-hosted runner, the way burrow's own gate does.
# The repo is public (#12), so hosted minutes cost nothing, and no PR, a fork's
# included, runs on remi. Jobs the flake can't hold (browsers, VMs) go
# alongside.
name: flake
on:
  # A PR retargeted onto another branch runs from flake-retarget.yml.
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@eb55208b20e5e6a5c7947e0293b770a1e2fdafc8 # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
