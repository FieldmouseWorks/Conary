# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow, on a GitHub-hosted runner, the way burrow's own gate does.
# The repo is public (#12), so hosted minutes cost nothing, and no PR, a fork's
# included, runs on remi. Jobs the flake can't hold (browsers, VMs) go
# alongside.
#
# Conary lands through its merge train (docs/m6-cutover.md, "Every repository
# lands through its train"): a push to a conary/train/ branch is a candidate,
# main with the PRs in it on top, and the gate on it attests the tree that
# lands, which is the only run conaryd counts for a required check.
name: flake
on:
  # A PR retargeted onto another branch runs from flake-retarget.yml.
  pull_request:
  push:
    branches: [main, "conary/train/**"]
permissions:
  contents: read
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@528218d12dbd9a203c6a2310e535d2fc6f894928 # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # Names this gate in what it attests, so a later push of the same tree
      # can be matched to it; only main's push asks remi's lookup
      # (docs/gate-reuse.md) and, on a hit, builds nothing.
      gate-reuse: true
      gate-reuse-lookup: https://remi.fieldmouseworks.com/conary/gate-reuse
