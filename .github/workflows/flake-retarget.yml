# The gate again for a PR retargeted onto another branch: the shared workflow's
# run counts only for the base it judged. GitHub can't start a run only for a
# new base, so a title or body edit starts one here too, and its job skips.
# That's why this is a file of its own: in flake.yml the skipped run would become
# that workflow's latest, and a ruleset requiring `check / check` would stop
# counting the push's. It keeps flake.yml's name (autoland and the shared
# workflow's concurrency group take the two as one workflow).
name: flake
on:
  pull_request:
    types: [edited]
permissions:
  contents: read
jobs:
  check:
    if: github.event.changes.base
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@f5c06e059ad64d85c8221b6e42fef8567e9bb8ae # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
