name: deploy-remi-candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit already merged into main to deploy.
        required: true
        type: string
      completion_mode:
        description: Exact deployment state that this run must prove.
        required: true
        type: choice
        options:
          - private-candidates
          - active-repopulation

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-and-verify
  cancel-in-progress: false
  queue: max

jobs:
  deploy-remi-candidate:
    name: deploy-remi-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: production
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out workflow authority for local actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-authority
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false
      - name: Require an exact commit already merged into main
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a full lowercase commit SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]] || {
            echo "checkout does not match requested candidate SHA" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main || {
            echo "candidate must already be merged into origin/main" >&2
            exit 1
          }
      - name: Start exact candidate artifact clock
        id: artifact-start
        shell: bash
        run: echo "started_ns=$(date -u +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Locate exact protected-main candidate build
        id: artifact-source
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-remi-candidate.yml/runs" \
            -f event=push -f status=success -f head_sha="$CANDIDATE_SHA" \
            -f branch=main -f per_page=100)"
          source_run="$(jq -c \
            --arg sha "$CANDIDATE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" '
              [.workflow_runs[]
                | select(.head_sha == $sha)
                | select(.head_branch == "main")
                | select(.event == "push")
                | select(.status == "completed")
                | select(.conclusion == "success")
                | select(.head_repository.full_name == $repository)
                | select(.path
                    | startswith(".github/workflows/build-remi-candidate.yml"))]
              | sort_by(.run_number)
              | last // empty
            ' <<<"$runs")"
          [[ -n "$source_run" ]] || {
            echo "no successful protected-main Remi artifact exists for $CANDIDATE_SHA" >&2
            exit 1
          }
          source_run_id="$(jq -r '.id' <<<"$source_run")"
          [[ "$source_run_id" =~ ^[0-9]+$ ]] || {
            echo "protected candidate build returned an invalid run id" >&2
            exit 1
          }
          echo "run_id=$source_run_id" >> "$GITHUB_OUTPUT"
      - name: Download exact protected-main candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remi-candidate-${{ github.event.inputs.commit_sha }}
          path: ${{ runner.temp }}/remi-candidate-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact-source.outputs.run_id }}
      - name: Verify exact candidate artifact and latency budget
        id: bundle
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/remi-candidate-artifact
          CANDIDATE_SHA: ${{ github.event.inputs.commit_sha }}
          SOURCE_RUN_ID: ${{ steps.artifact-source.outputs.run_id }}
          STARTED_NS: ${{ steps.artifact-start.outputs.started_ns }}
        shell: bash
        run: |
          set -euo pipefail
          verification="$(scripts/remi-candidate-artifact.sh verify \
            "$ARTIFACT_DIR" "$CANDIDATE_SHA" "$SOURCE_RUN_ID" push)"
          jq -e '.schema_version == 2' <<<"$verification" >/dev/null
          finished_ns="$(date -u +%s%N)"
          availability_ms=$(( (finished_ns - STARTED_NS) / 1000000 ))
          (( availability_ms <= 60000 )) || {
            echo "exact candidate artifact took ${availability_ms} ms to locate, download, and verify" >&2
            exit 1
          }
          cp -- "$ARTIFACT_DIR/remi-candidate-manifest.json" \
            remi-candidate-manifest.json
          echo "version=$(jq -r '.version' <<<"$verification")" >> "$GITHUB_OUTPUT"
          echo "bundle=$(jq -r '.bundle' <<<"$verification")" >> "$GITHUB_OUTPUT"
          echo "binary_sha256=$(jq -r '.binary_sha256' <<<"$verification")" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$(jq -r '.bundle_sha256' <<<"$verification")" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "availability_ms=$availability_ms" >> "$GITHUB_OUTPUT"
      - name: Configure pinned production SSH
        id: production-ssh
        uses: ./workflow-authority/.github/actions/setup-pinned-production-ssh
        with:
          private-key: ${{ secrets.REMI_SSH_KEY }}
          known-hosts: ${{ secrets.REMI_SSH_KNOWN_HOSTS }}
          target: ${{ secrets.REMI_SSH_TARGET }}
      - name: Deploy merged Remi candidate
        uses: ./workflow-authority/.github/actions/deploy-remi-bundle
        with:
          version: ${{ steps.bundle.outputs.version }}
          bundle: ${{ steps.bundle.outputs.bundle }}
          binary-sha256: ${{ steps.bundle.outputs.binary_sha256 }}
          commit-sha: ${{ github.event.inputs.commit_sha }}
          ssh-config: ${{ steps.production-ssh.outputs.config-path }}
          ssh-target: ${{ secrets.REMI_SSH_TARGET }}
          completion-mode: ${{ github.event.inputs.completion_mode }}
      - name: Record exact candidate evidence
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.commit_sha }}
          VERSION: ${{ steps.bundle.outputs.version }}
          BINARY_SHA256: ${{ steps.bundle.outputs.binary_sha256 }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.bundle_sha256 }}
          SOURCE_RUN_ID: ${{ steps.bundle.outputs.source_run_id }}
          ARTIFACT_AVAILABILITY_MS: ${{ steps.bundle.outputs.availability_ms }}
          COMPLETION_MODE: ${{ github.event.inputs.completion_mode }}
        shell: bash
        run: |
          {
            echo "### Merged Remi candidate deployment"
            echo
            echo "- commit: \`$CANDIDATE_SHA\`"
            echo "- binary version: \`$VERSION\`"
            echo "- binary SHA-256: \`$BINARY_SHA256\`"
            echo "- bundle SHA-256: \`$BUNDLE_SHA256\`"
            echo "- protected build run: \`$SOURCE_RUN_ID\`"
            echo "- artifact locate/download/verify: \`${ARTIFACT_AVAILABILITY_MS} ms\`"
            echo "- completion mode: \`$COMPLETION_MODE\`"
            if [[ "$COMPLETION_MODE" == "private-candidates" ]]; then
              echo "- candidate refresh: forced after binary transition; every public fencing epoch advanced"
            fi
            echo "- release/tag created: no"
          } >> "$GITHUB_STEP_SUMMARY"
