name: cache-base-image
description: >-
  Restore optional cached layers, then require a registry pull by the reviewed
  digest on every run. Registered retained images use their project-owned
  registry; cache names never establish image authority. Docker verifies the
  manifest/config/layer content while pulling the pinned reference.
inputs:
  distro:
    description: Test distro slug from the typed conary-test configuration.
    required: true
  harness:
    description: Verified conary-test executable used to resolve typed image configuration.
    required: false
    default: target/debug/conary-test
runs:
  using: composite
  steps:
    - name: Resolve the pinned base image reference
      id: base-image
      shell: bash
      run: |
        set -euo pipefail

        harness="${{ inputs.harness }}"
        [[ -x "$harness" ]] || {
          echo "configured conary-test harness is missing: $harness" >&2
          exit 1
        }
        ref="$("$harness" images base-ref --distro '${{ inputs.distro }}')"
        [[ "$ref" == *@sha256:* ]] || {
          echo "configured base image for ${{ inputs.distro }} is not digest-pinned: $ref" >&2
          exit 1
        }

        ref="$(python3 "$GITHUB_ACTION_PATH/../../../scripts/ci-base-image.py" resolve "$ref")"
        digest="${ref##*@sha256:}"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - name: Restore the cached base image
      id: cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.cache/conary-base-images/${{ inputs.distro }}.tar
        key: conary-base-image-v2-${{ inputs.distro }}-${{ steps.base-image.outputs.digest }}

    - name: Load the cached base image
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker load --input ~/.cache/conary-base-images/${{ inputs.distro }}.tar

    - name: Require the reviewed registry image by digest
      shell: bash
      env:
        BASE_IMAGE_REF: ${{ steps.base-image.outputs.ref }}
      run: |
        set -euo pipefail

        max_attempts=3
        attempt=1
        until docker pull "$BASE_IMAGE_REF"; do
          if (( attempt >= max_attempts )); then
            echo "failed to pull $BASE_IMAGE_REF after $max_attempts attempts" >&2
            exit 1
          fi
          sleep_for=$(( attempt * 5 ))
          echo "pull attempt $attempt of $max_attempts failed for $BASE_IMAGE_REF, retrying in ${sleep_for}s..." >&2
          sleep "$sleep_for"
          attempt=$(( attempt + 1 ))
        done

        docker image inspect "$BASE_IMAGE_REF" --format '{{json .RepoDigests}}' \
          | python3 -c 'import json,sys; expected=sys.argv[1].rsplit("@",1)[1]; assert any(ref.rsplit("@",1)[-1] == expected for ref in json.load(sys.stdin)), "pulled image lacks its required manifest digest"' "$BASE_IMAGE_REF"

    - name: Save the pulled base image into the cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BASE_IMAGE_REF: ${{ steps.base-image.outputs.ref }}
      run: |
        set -euo pipefail
        mkdir -p ~/.cache/conary-base-images
        docker save --output ~/.cache/conary-base-images/${{ inputs.distro }}.tar "$BASE_IMAGE_REF"
