[package]
name = "conary-cli"
version = "0.0.0"
description = "cn, Conary's command line"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# The example plugin is a second binary; plain `cargo run -p conary-cli` stays cn.
default-run = "cn"

[[bin]]
name = "cn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
conary-core = { version = "0.0.0", path = "../conary-core" }
conary-github = { version = "0.0.0", path = "../conary-github" }
ed25519-dalek = "3.0.0"
serde = "1.0.229"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

[[bin]]
name = "conary-example-plugin"
path = "../conary-core/examples/plugin.rs"
