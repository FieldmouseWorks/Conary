[package]
name = "conary-core"
version = "0.0.0"
description = "Conary's core: the model, the ids that name it, and the signed op log it lives in"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
blake3 = "1.8.7"
conary-plugin = { version = "5.0.0", path = "../conary-plugin", features = ["schemars"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
regex = "1.13.1"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }

tempfile = "3.27.0"
toml = "1.2.1"

[lints]
workspace = true
