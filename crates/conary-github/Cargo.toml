[package]
name = "conary-github"
version = "0.0.0"
description = "Conary's GitHub side: reading a pull request's state into ledger ops"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
conary-core = { version = "0.0.0", path = "../conary-core" }
ed25519-dalek = "3.0.0"
regex = "1.13.1"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.11.0", default-features = false }
sha2 = "0.11.1"
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
ureq = { version = "3.5.0", features = ["json", "platform-verifier"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

# The simulations execute the published example through the real runner.
# Cargo builds it before this package's integration tests, with its real deps.
[[bin]]
name = "conary-flow-test-plugin"
path = "../conary-core/examples/plugin.rs"
test = false
bench = false
doc = false

[[bin]]
name = "conary-execution-test-plugin"
path = "tests/support/execution_plugin.rs"
test = false
bench = false
doc = false
