# tests/integration/remi/manifests/phase2-group-a.toml
#
# Phase 2, Group A: Deep Install Flow (T38-T50).
# Converted from tests/integration/remi/runner/test_runner.py run_group_a().
#
# Variables: ${REMI_ENDPOINT}, ${DB_PATH}, ${CONARY_BIN}
# Fixture variables: ${FIXTURE_PKG_NAME}, ${FIXTURE_FILE}, ${FIXTURE_ADDED_FILE},
#                    ${FIXTURE_MARKER}, ${FIXTURE_V1_CCS}, ${FIXTURE_V2_CCS},
#                    ${FIXTURE_SHELL_CCS}, ${FIXTURE_BASE_CCS},
#                    ${FIXTURE_V1_HELLO_SHA256}, ${FIXTURE_V2_HELLO_SHA256},
#                    ${FIXTURE_V2_ADDED_SHA256}
# Publication queries: steps begin with ${RESOLVE_PUBLISHED_GENERATION}, which
# resolves the generation `/conary/current` names into `$N` and fails loudly if
# the symlink is missing. They then read the typed manifests under
# `/conary/generations/$N/` with sqlite3, never the unbooted live root.

[suite]
name = "Phase 2, Group A: Deep Install Flow (T38-T50)"
phase = 2
requires_fixtures = ["conary-test-shell", "conary-test-base"]

# Provides /bin/sh for the fixture's post-install hook (#1080).
[[suite.setup]]
conary = "ccs install ${FIXTURE_SHELL_CCS} --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[suite.setup.assert]
exit_code = 0

# Provides /sbin/init and fake boot assets so installs can publish a generation (#1102).
[[suite.setup]]
conary = "ccs install ${FIXTURE_BASE_CCS} --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[suite.setup.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T38: Install fixture v1
# --------------------------------------------------------------------------

[[test]]
id = "T38"
name = "install_fixture_v1_with_deps"
description = "Install CCS fixture package v1 with dependencies"
timeout = 300
group = "A"
fatal = true

[[test.step]]
conary = "ccs install ${FIXTURE_V1_CCS} --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

# T38 must prove the install published a generation, not just that it exited 0.
# `generation_publications.recoverable` is the typed publication-debt flag; the
# exact numeric count becomes this step's exit status, so no human-readable
# text is matched (#1102).
[[test.step]]
run = "test \"$(sqlite3 ${DB_PATH} 'SELECT COUNT(*) FROM generation_publications WHERE recoverable = 1')\" -eq 0"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T39: Verify dep files on disk
# --------------------------------------------------------------------------

[[test]]
id = "T39"
name = "verify_dep_files_on_disk"
description = "Verify fixture v1 file and directory nodes in the published generation manifest"
timeout = 10
group = "A"
depends_on = ["T38"]

# The unbooted container never materializes a published generation at `/`, so
# query the typed generation manifest of the generation `/conary/current`
# names. Exact path equality and a typed node kind, never a text search.
[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/generation-root.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_FILE}' AND json_extract(value, '$.node.source.kind.type') = 'regular'\")\" -eq 1"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/generation-root.json'), '$.entries') WHERE json_extract(value, '$.path') = '/usr/share/conary-test' AND json_extract(value, '$.node.source.kind.type') = 'directory'\")\" -eq 1"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T40: Verify v1 checksum
# --------------------------------------------------------------------------

[[test]]
id = "T40"
name = "verify_v1_checksum"
description = "Verify the published generation manifest records hello.txt's SHA-256"
timeout = 10
group = "A"
depends_on = ["T38"]

# `content.sha256` is the raw SHA-256 of the node content (the default CAS
# digest algorithm, and therefore the CAS object name), so it compares directly
# to the fixture's content hash.
[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/generation-root.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_FILE}' AND json_extract(value, '$.content.sha256') = '${FIXTURE_V1_HELLO_SHA256}'\")\" -eq 1"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T41: Verify scriptlet ran
# --------------------------------------------------------------------------

[[test]]
id = "T41"
name = "verify_scriptlet_ran"
description = "Verify the post-install scriptlet marker is in the published mutable state"
timeout = 10
group = "A"
depends_on = ["T38"]

# The marker lives under `/var`, so publication records it in the
# mutable-state manifest rather than the immutable generation root.
[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/mutable-state.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_MARKER}'\")\" -eq 1"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T42: Remove with scriptlets
# --------------------------------------------------------------------------

[[test]]
id = "T42"
name = "remove_with_scriptlets"
description = "Remove fixture package and verify scriptlet cleanup"
timeout = 60
group = "A"
depends_on = ["T38"]

# Record the pre-removal generation so the absence checks can prove a new
# generation was published instead of passing against a stale one.
[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && printf '%s' \"$N\" > /tmp/conary-t42-generation-before"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "remove ${FIXTURE_PKG_NAME} --sandbox always --yes"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$N\" -gt \"$(cat /tmp/conary-t42-generation-before)\""

[test.step.assert]
exit_code = 0

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/mutable-state.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_MARKER}'\")\" -eq 0"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/generation-root.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_FILE}'\")\" -eq 0"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T43: Reinstall fixture v1
# --------------------------------------------------------------------------

[[test]]
id = "T43"
name = "reinstall_fixture_v1"
description = "Reinstall CCS fixture package v1 for update tests"
timeout = 300
group = "A"
depends_on = ["T42"]
fatal = true

[[test.step]]
conary = "ccs install ${FIXTURE_V1_CCS} --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T44: Update v1 to v2
# --------------------------------------------------------------------------

[[test]]
id = "T44"
name = "update_v1_to_v2"
description = "Update fixture package from v1 to v2 via CCS install"
timeout = 300
group = "A"
depends_on = ["T43"]
fatal = true

[[test.step]]
conary = "ccs install ${FIXTURE_V2_CCS} --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T45: Delta update verify
# --------------------------------------------------------------------------

[[test]]
id = "T45"
name = "delta_update_verify"
description = "Verify v2 hello.txt checksum after update"
timeout = 10
group = "A"
depends_on = ["T44"]

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/generation-root.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_FILE}' AND json_extract(value, '$.content.sha256') = '${FIXTURE_V2_HELLO_SHA256}'\")\" -eq 1"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T46: Verify v2 added file
# --------------------------------------------------------------------------

[[test]]
id = "T46"
name = "verify_v2_added_file"
description = "Verify the v2 added file is a regular node with its SHA-256 in the generation manifest"
timeout = 10
group = "A"
depends_on = ["T44"]

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/generation-root.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_ADDED_FILE}' AND json_extract(value, '$.node.source.kind.type') = 'regular'\")\" -eq 1"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/generation-root.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_ADDED_FILE}' AND json_extract(value, '$.content.sha256') = '${FIXTURE_V2_ADDED_SHA256}'\")\" -eq 1"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T47: Rollback after update
# --------------------------------------------------------------------------

[[test]]
id = "T47"
name = "rollback_after_update"
description = "Rollback the v1->v2 update using changeset history"
timeout = 120
group = "A"
depends_on = ["T44"]

# Record the pre-rollback generation so T48 can prove the rollback published a
# new generation rather than leaving the update's generation in place.
[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && printf '%s' \"$N\" > /tmp/conary-t48-generation-before"

[test.step.assert]
exit_code = 0

# Get history and extract the most recent changeset ID, then rollback.
# The shell pipeline extracts the first Changeset N: heading from history output.
[[test.step]]
run = "CS_ID=$(${CONARY_BIN} system history --db-path ${DB_PATH} | sed -n 's/^Changeset \\([0-9][0-9]*\\):$/\\1/p' | head -1) && ${CONARY_BIN} system state rollback $CS_ID --yes --db-path ${DB_PATH}"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T48: Rollback filesystem check
# --------------------------------------------------------------------------

[[test]]
id = "T48"
name = "rollback_filesystem_check"
description = "Verify filesystem is restored to v1 state after rollback"
timeout = 10
group = "A"
depends_on = ["T47"]

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$N\" -gt \"$(cat /tmp/conary-t48-generation-before)\""

[test.step.assert]
exit_code = 0

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/generation-root.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_FILE}' AND json_extract(value, '$.content.sha256') = '${FIXTURE_V1_HELLO_SHA256}'\")\" -eq 1"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "${RESOLVE_PUBLISHED_GENERATION} && test \"$(sqlite3 :memory: \"SELECT COUNT(*) FROM json_each(readfile('/conary/generations/$N/generation-root.json'), '$.entries') WHERE json_extract(value, '$.path') = '${FIXTURE_ADDED_FILE}'\")\" -eq 0"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T49: Pin blocks update
# --------------------------------------------------------------------------

[[test]]
id = "T49"
name = "pin_blocks_update"
description = "Pin fixture package, verify pinned status, then unpin"
timeout = 120
group = "A"
depends_on = ["T43"]

# Pin the package
[[test.step]]
conary = "pin ${FIXTURE_PKG_NAME}"

[test.step.assert]
exit_code = 0

# Verify pinned status shows yes
[[test.step]]
conary = "list ${FIXTURE_PKG_NAME} --info"

[test.step.assert]
exit_code = 0
stdout_contains = "  Pinned: yes"

# Unpin the package
[[test.step]]
conary = "unpin ${FIXTURE_PKG_NAME}"

[test.step.assert]
exit_code = 0

# Verify unpin took effect
[[test.step]]
conary = "list ${FIXTURE_PKG_NAME} --info"

[test.step.assert]
exit_code = 0
stdout_contains = "  Pinned: no"

# --------------------------------------------------------------------------
# T50: Orphan detection
# --------------------------------------------------------------------------

[[test]]
id = "T50"
name = "orphan_detection"
description = "Remove fixture and verify orphan detection does not crash"
timeout = 60
group = "A"
depends_on = ["T43"]

# Remove the package (may already be removed, check=False equivalent)
[[test.step]]
conary = "remove ${FIXTURE_PKG_NAME} --sandbox always --yes"

# List orphans -- just verify no crash
[[test.step]]
conary = "list --orphans"
