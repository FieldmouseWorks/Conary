# tests/integration/remi/manifests/phase2-group-a.toml
#
# Phase 2, Group A: Deep Install Flow (T38-T50).
# Converted from tests/integration/remi/runner/test_runner.py run_group_a().
#
# Variables: ${REMI_ENDPOINT}, ${DB_PATH}, ${CONARY_BIN}
# Fixture variables: ${FIXTURE_PKG_NAME}, ${FIXTURE_FILE}, ${FIXTURE_ADDED_FILE},
#                    ${FIXTURE_MARKER}, ${FIXTURE_V1_CCS}, ${FIXTURE_V2_CCS},
#                    ${FIXTURE_V1_HELLO_SHA256}, ${FIXTURE_V2_HELLO_SHA256},
#                    ${FIXTURE_V2_ADDED_SHA256}

[suite]
name = "Phase 2, Group A: Deep Install Flow (T38-T50)"
phase = 2

# --------------------------------------------------------------------------
# T38: Install fixture v1
# --------------------------------------------------------------------------

[[test]]
id = "T38"
name = "install_fixture_v1_with_deps"
description = "Install CCS fixture package v1 with dependencies"
timeout = 300
group = "A"
fatal = true

[[test.step]]
conary = "ccs install ${FIXTURE_V1_CCS} --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T39: Verify dep files on disk
# --------------------------------------------------------------------------

[[test]]
id = "T39"
name = "verify_dep_files_on_disk"
description = "Verify fixture v1 files and directory exist on disk"
timeout = 10
group = "A"
depends_on = ["T38"]

[[test.step]]
file_exists = "${FIXTURE_FILE}"

[[test.step]]
dir_exists = "/usr/share/conary-test"

# --------------------------------------------------------------------------
# T40: Verify v1 checksum
# --------------------------------------------------------------------------

[[test]]
id = "T40"
name = "verify_v1_checksum"
description = "Verify fixture v1 hello.txt has correct SHA-256 checksum"
timeout = 10
group = "A"
depends_on = ["T38"]

[[test.step]]
file_checksum = { path = "${FIXTURE_FILE}", sha256 = "${FIXTURE_V1_HELLO_SHA256}" }

# --------------------------------------------------------------------------
# T41: Verify scriptlet ran
# --------------------------------------------------------------------------

[[test]]
id = "T41"
name = "verify_scriptlet_ran"
description = "Verify post-install scriptlet created the marker file"
timeout = 10
group = "A"
depends_on = ["T38"]

[[test.step]]
file_exists = "${FIXTURE_MARKER}"

# --------------------------------------------------------------------------
# T42: Remove with scriptlets
# --------------------------------------------------------------------------

[[test]]
id = "T42"
name = "remove_with_scriptlets"
description = "Remove fixture package and verify scriptlet cleanup"
timeout = 60
group = "A"
depends_on = ["T38"]

[[test.step]]
conary = "remove ${FIXTURE_PKG_NAME} --sandbox always --yes"

[test.step.assert]
exit_code = 0

[[test.step]]
file_not_exists = "${FIXTURE_MARKER}"

[[test.step]]
file_not_exists = "${FIXTURE_FILE}"

# --------------------------------------------------------------------------
# T43: Reinstall fixture v1
# --------------------------------------------------------------------------

[[test]]
id = "T43"
name = "reinstall_fixture_v1"
description = "Reinstall CCS fixture package v1 for update tests"
timeout = 300
group = "A"
depends_on = ["T42"]
fatal = true

[[test.step]]
conary = "ccs install ${FIXTURE_V1_CCS} --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T44: Update v1 to v2
# --------------------------------------------------------------------------

[[test]]
id = "T44"
name = "update_v1_to_v2"
description = "Update fixture package from v1 to v2 via CCS install"
timeout = 300
group = "A"
depends_on = ["T43"]
fatal = true

[[test.step]]
conary = "ccs install ${FIXTURE_V2_CCS} --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T45: Delta update verify
# --------------------------------------------------------------------------

[[test]]
id = "T45"
name = "delta_update_verify"
description = "Verify v2 hello.txt checksum after update"
timeout = 10
group = "A"
depends_on = ["T44"]

[[test.step]]
file_checksum = { path = "${FIXTURE_FILE}", sha256 = "${FIXTURE_V2_HELLO_SHA256}" }

# --------------------------------------------------------------------------
# T46: Verify v2 added file
# --------------------------------------------------------------------------

[[test]]
id = "T46"
name = "verify_v2_added_file"
description = "Verify v2 added file exists with correct checksum"
timeout = 10
group = "A"
depends_on = ["T44"]

[[test.step]]
file_exists = "${FIXTURE_ADDED_FILE}"

[[test.step]]
file_checksum = { path = "${FIXTURE_ADDED_FILE}", sha256 = "${FIXTURE_V2_ADDED_SHA256}" }

# --------------------------------------------------------------------------
# T47: Rollback after update
# --------------------------------------------------------------------------

[[test]]
id = "T47"
name = "rollback_after_update"
description = "Rollback the v1->v2 update using changeset history"
timeout = 120
group = "A"
depends_on = ["T44"]

# Get history and extract the most recent changeset ID, then rollback.
# The shell pipeline extracts the first Changeset N: heading from history output.
[[test.step]]
run = "CS_ID=$(${CONARY_BIN} system history --db-path ${DB_PATH} | sed -n 's/^Changeset \\([0-9][0-9]*\\):$/\\1/p' | head -1) && ${CONARY_BIN} system state rollback $CS_ID --yes --db-path ${DB_PATH}"

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# T48: Rollback filesystem check
# --------------------------------------------------------------------------

[[test]]
id = "T48"
name = "rollback_filesystem_check"
description = "Verify filesystem is restored to v1 state after rollback"
timeout = 10
group = "A"
depends_on = ["T47"]

[[test.step]]
file_checksum = { path = "${FIXTURE_FILE}", sha256 = "${FIXTURE_V1_HELLO_SHA256}" }

[[test.step]]
file_not_exists = "${FIXTURE_ADDED_FILE}"

# --------------------------------------------------------------------------
# T49: Pin blocks update
# --------------------------------------------------------------------------

[[test]]
id = "T49"
name = "pin_blocks_update"
description = "Pin fixture package, verify pinned status, then unpin"
timeout = 120
group = "A"
depends_on = ["T43"]

# Pin the package
[[test.step]]
conary = "pin ${FIXTURE_PKG_NAME}"

[test.step.assert]
exit_code = 0

# Verify pinned status shows yes
[[test.step]]
conary = "list ${FIXTURE_PKG_NAME} --info"

[test.step.assert]
exit_code = 0
stdout_contains = "  Pinned: yes"

# Unpin the package
[[test.step]]
conary = "unpin ${FIXTURE_PKG_NAME}"

[test.step.assert]
exit_code = 0

# Verify unpin took effect
[[test.step]]
conary = "list ${FIXTURE_PKG_NAME} --info"

[test.step.assert]
exit_code = 0
stdout_contains = "  Pinned: no"

# --------------------------------------------------------------------------
# T50: Orphan detection preview
# --------------------------------------------------------------------------

[[test]]
id = "T50"
name = "orphan_detection_preview"
description = "Demote dependency-reason packages with a strict model and preview the sole orphan via autoremove --dry-run"
timeout = 180
group = "A"
depends_on = ["T49"]

# Remove the base fixture so the strict model cannot demote it.
[[test.step]]
conary = "remove ${FIXTURE_PKG_NAME} --sandbox always --yes"

[test.step.assert]
exit_code = 0

# Install the fixture dependency graph. Plain ccs install marks every
# package as explicit, so the model apply below supplies dependency reasons.
[[test.step]]
conary = "ccs install /opt/remi-tests/fixtures/adversarial/deps/dep-base-v1/output/dep-base-1.0.0-1.ccs --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "ccs install /opt/remi-tests/fixtures/adversarial/deps/dep-liba-v1/output/dep-liba-1.0.0-1.ccs --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "ccs install /opt/remi-tests/fixtures/adversarial/deps/dep-libb-v1/output/dep-libb-1.0.0-1.ccs --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

[[test.step]]
conary = "ccs install /opt/remi-tests/fixtures/adversarial/deps/dep-app-v1/output/dep-app-1.0.0-1.ccs --policy ${FIXTURE_CCS_POLICY} --sandbox always --yes"

[test.step.assert]
exit_code = 0

# A strict model demotes every explicit package absent from install[] to a
# dependency reason; that is the supported path to dependency-reason records.
[[test.step]]
run = "printf '[model]\\nversion = 1\\ninstall = [\"dep-liba\"]\\n' > /tmp/t50-system.toml"

[test.step.assert]
exit_code = 0

# --no-autoremove is required because model apply runs autoremove by default,
# which would remove the very orphans this test previews. Strict mode is what
# performs the explicit-to-dependency demotion.
[[test.step]]
conary = "model apply --model /tmp/t50-system.toml --strict --no-autoremove --offline --yes"

[test.step.assert]
exit_code = 0

# dep-app, dep-libb, and dep-base were demoted; dep-liba stayed explicit.
[[test.step]]
conary = "query reason dependency"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["dep-app", "dep-libb", "dep-base"]

[[test.step]]
conary = "query reason explicit"

[test.step.assert]
exit_code = 0
stdout_contains = "dep-liba"

# Only dep-app is an orphan: dep-libb and dep-base are still required, and
# dep-liba is explicit, so dep-lib must not appear in the preview at all.
[[test.step]]
conary = "autoremove --dry-run"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["Found 1 orphaned package(s):", "  dep-app 1.0.0", "Dry run - no packages will be removed."]
stdout_not_contains = "dep-lib"

# The assert holds only one not-contains string, so check dep-base separately.
[[test.step]]
conary = "autoremove --dry-run"

[test.step.assert]
exit_code = 0
stdout_not_contains = "dep-base"

# The dry run must not have removed or re-labelled anything.
[[test.step]]
conary = "query reason dependency"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["dep-app", "dep-libb", "dep-base"]

[[test.step]]
file_exists = "/usr/bin/dep-app-v1"
