# --------------------------------------------------------------------------
# TNPM11: security metadata honesty
# --------------------------------------------------------------------------

[[test]]
id = "TNPM11"
name = "security_metadata_honesty"
description = "Security-only update refuses before mutation when source advisory metadata support is unknown"
timeout = 90
fatal = true
depends_on = ["TNPM10"]

[[test.step]]
run = "BEFORE=$(sqlite3 ${DB_PATH} \"SELECT version FROM troves WHERE name = '${repo_install_pkg}'\"); echo \"$BEFORE\" > /tmp/native-pm-security-before; CONARY_BIN=${CONARY_BIN} /opt/remi-tests/fixtures/native/prepare-unknown-security-repository.sh ${repo_install_pkg} ${repo_seed_security_version} ${native_scheme} ${native_arch} ${native_profile} ${DB_PATH}"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "CONARY_TEST_SKIP_GENERATION_MOUNT=1 ${CONARY_BIN} update --security ${repo_install_pkg} --db-path ${DB_PATH} --root /conary --yes --sandbox always 2>&1"

[test.step.assert]
exit_code_not = 0
stdout_contains = "security metadata"

[[test.step]]
run = "BEFORE=$(cat /tmp/native-pm-security-before); AFTER=$(sqlite3 ${DB_PATH} \"SELECT version FROM troves WHERE name = '${repo_install_pkg}'\"); test \"$BEFORE\" = \"$AFTER\""

[test.step.assert]
exit_code = 0

# --------------------------------------------------------------------------
# TNPM12: autoremove delegates through remove contract
# --------------------------------------------------------------------------

[[test]]
id = "TNPM12"
name = "autoremove_orphaned_repository_package"
description = "Autoremove lists and removes an orphaned Conary-owned package through the remove contract"
timeout = 180
fatal = true
depends_on = ["TNPM11"]

[[test.step]]
run = "printf '[model]\\nversion = 1\\ninstall = [\"native-matrix-root-layout\", \"phase4-runtime-fixture\"]\\n' > /tmp/native-pm-autoremove-model.toml && ${CONARY_BIN} model apply --model /tmp/native-pm-autoremove-model.toml --db-path ${DB_PATH} --root /conary --strict --no-autoremove --offline --yes"

[test.step.assert]
exit_code = 0
stdout_contains = "Marked '${repo_install_pkg}' as dependency"

[[test.step]]
run = "${CONARY_BIN} autoremove --db-path ${DB_PATH} --root /conary --dry-run --json"

[test.step.assert]
exit_code = 0
stdout_json = [
  { pointer = "/operation", equals = "package.autoremove.plan" },
  { pointer = "/status", equals = "planned" },
  { pointer = "/data/schema_version", equals = 2 },
  { pointer = "/data/removable", equals = [{ name = "${repo_install_pkg}", version = "1.0.0", package_release = "1", architecture = "${native_arch}", round = 1 }] },
]

[[test.step]]
run = "CONARY_TEST_SKIP_GENERATION_MOUNT=1 ${CONARY_BIN} autoremove --db-path ${DB_PATH} --root /conary --sandbox always --yes"

[test.step.assert]
exit_code = 0
stdout_contains_all = ["Autoremove complete", "Removed: 1"]

[[test.step]]
run = "/opt/remi-tests/fixtures/native/assert-selected-generation.py --root /conary --absent ${repo_install_path} --expect-sha256 /usr/bin/phase4-runtime-fixture=517631de24336343a6aaf1a8f704d326299c14c619fe8c8d75d17824d074bd7f"

[test.step.assert]
exit_code = 0

[[test.step]]
run = "sqlite3 -json ${DB_PATH} \"SELECT COUNT(*) AS installed FROM troves WHERE name = '${repo_install_pkg}'\""

[test.step.assert]
exit_code = 0
stdout_json = [
  { pointer = "", equals = [{ installed = 0 }] },
]
