[package]
name = "conary-test-shell"
version = "1.0.0"
version_scheme = "conary"
release = "1"
kind = "package"
description = "Hermetic static /bin/sh provider for integration suites"
license = "MIT"

[package.platform]
os = "linux"
arch = "x86_64"
libc = "gnu"

[provides]
capabilities = ["conary-test-shell"]
files = ["/bin/sh"]

[components]
default = ["runtime"]
