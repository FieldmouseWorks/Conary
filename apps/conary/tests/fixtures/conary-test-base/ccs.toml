[package]
name = "conary-test-base"
version = "1.0.0"
version_scheme = "conary"
release = "1"
kind = "package"
description = "Fake /sbin/init and boot-asset base for container integration suites"
license = "MIT"

[package.platform]
os = "linux"
arch = "x86_64"
libc = "gnu"

[provides]
capabilities = ["conary-test-base"]
files = ["/sbin/init"]

[components]
default = ["runtime"]
